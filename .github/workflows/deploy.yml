name: Build and Deploy
run-name: ${{ inputs.skip_deploy && 'Build images only' || 'Build → GHCR → VPS' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Build and publish without deploying
        required: false
        type: boolean
        default: false

concurrency:
  group: facebook-messenger-ai-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.25.0"

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Test deploy and retention scripts
        run: |
          bash tests/deploy-script.test.sh
          bash tests/image-retention.test.sh

  images:
    name: Build image → GHCR (${{ matrix.name }})
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: control-plane
            dockerfile: docker/Dockerfile.control-plane
          - name: scheduler
            dockerfile: docker/Dockerfile.scheduler
          - name: ai-worker
            dockerfile: docker/Dockerfile.ai-worker
          - name: browser-agent
            dockerfile: docker/Dockerfile.browser-agent
    outputs:
      control-plane: ${{ steps.digest.outputs.control-plane }}
      scheduler: ${{ steps.digest.outputs.scheduler }}
      ai-worker: ${{ steps.digest.outputs.ai-worker }}
      browser-agent: ${{ steps.digest.outputs.browser-agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lc}/facebook-messenger-ai-${SERVICE}" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Export immutable image reference
        id: digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.name }}
        run: echo "${SERVICE}=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS
    needs: images
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Sync deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/facebook-messenger-ai-rep/backups'
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes \
            compose.prod.yml scripts/deploy.sh scripts/image-retention.sh \
            "$VPS_USER@$VPS_HOST:/opt/facebook-messenger-ai-rep/"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'chmod 755 /opt/facebook-messenger-ai-rep/deploy.sh /opt/facebook-messenger-ai-rep/image-retention.sh'

      - name: Log VPS in to GHCR
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy immutable images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          CONTROL_PLANE_IMAGE: ${{ needs.images.outputs.control-plane }}
          SCHEDULER_IMAGE: ${{ needs.images.outputs.scheduler }}
          AI_WORKER_IMAGE: ${{ needs.images.outputs.ai-worker }}
          BROWSER_AGENT_IMAGE: ${{ needs.images.outputs.browser-agent }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "/opt/facebook-messenger-ai-rep/deploy.sh '$CONTROL_PLANE_IMAGE' '$SCHEDULER_IMAGE' '$AI_WORKER_IMAGE' '$BROWSER_AGENT_IMAGE'"

      - name: Report deployment status
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" '/opt/facebook-messenger-ai-rep/deploy.sh --status' || true

      - name: Remove ephemeral GHCR credentials
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'docker logout ghcr.io' || true
