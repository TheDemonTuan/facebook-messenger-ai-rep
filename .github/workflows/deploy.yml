name: Build and Deploy
run-name: ${{ inputs.skip_deploy && 'Build images only' || 'Build → GHCR → VPS' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Build and publish without deploying
        required: false
        type: boolean
        default: false
      force_all:
        description: Force build and deploy all services
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.1"

jobs:
  verify:
    name: Verify source
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      has_images: ${{ steps.set-matrix.outputs.has_images }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      db_migration: ${{ steps.filter.outputs.db_migration }}
      compose_config: ${{ steps.filter.outputs.compose_config }}
      deploy_scripts: ${{ steps.filter.outputs.deploy_scripts }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            core:
              - 'apps/core/**'
              - 'apps/dashboard/**'
              - 'packages/ai/**'
              - 'packages/contracts/**'
              - 'packages/config/**'
              - 'packages/db/**'
              - 'packages/channel/**'
              - 'docker/Dockerfile.core'
              - 'package.json'
              - 'bun.lock'
            browser_agent:
              - 'apps/browser-agent/**'
              - 'packages/channel/**'
              - 'packages/contracts/**'
              - 'packages/config/**'
              - 'packages/db/src/**'
              - 'packages/db/package.json'
              - 'packages/db/tsconfig.json'
              - 'docker/Dockerfile.browser-agent'
              - 'docker/entrypoint-browser.sh'
              - 'package.json'
              - 'bun.lock'
            db_migration:
              - 'packages/db/migrations/**'
              - 'packages/db/src/schema/**'
            compose_config:
              - 'compose.prod.yml'
            deploy_scripts:
              - 'scripts/deploy.sh'
              - 'scripts/image-retention.sh'

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: Verify database schema and migrations are in sync
        run: |
          bun --filter=@messenger/db run db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::Database schema was modified without generating migrations! Run 'bun --filter=@messenger/db run db:generate' and commit the migration files."
            git status --porcelain packages/db/migrations
            exit 1
          fi
      - name: Test deploy and retention scripts
        run: |
          bash tests/deploy-script.test.sh
          bash tests/image-retention.test.sh

      - name: Determine image build matrix
        id: set-matrix
        env:
          CORE: ${{ steps.filter.outputs.core }}
          BA: ${{ steps.filter.outputs.browser_agent }}
          FORCE: ${{ inputs.force_all }}
        run: |
          bun -e '
            const list = [];
            const force = process.env.FORCE === "true";
            if (force || process.env.CORE === "true") {
              list.push({ name: "core", dockerfile: "docker/Dockerfile.core" });
            }
            if (force || process.env.BA === "true") {
              list.push({ name: "browser-agent", dockerfile: "docker/Dockerfile.browser-agent" });
            }
            const hasImages = list.length > 0;
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_images=${hasImages}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: list })}\n`);
          '

  images:
    name: Build image → GHCR (${{ matrix.name }})
    concurrency:
      group: images-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    needs: verify
    if: ${{ needs.verify.outputs.has_images == 'true' }}
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lc}/facebook-messenger-ai-${SERVICE}" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Save digest artifact
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.name }}
        run: |
          mkdir -p digests
          echo "${IMAGE}@${DIGEST}" > "digests/${SERVICE}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: digests-${{ matrix.name }}
          path: digests/

  deploy:
    name: Deploy to VPS
    concurrency:
      group: facebook-messenger-ai-production-deploy
      cancel-in-progress: false
    needs: [verify, images]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_deploy) &&
      (needs.verify.outputs.has_images == 'true' || needs.verify.outputs.db_migration == 'true' || needs.verify.outputs.compose_config == 'true' || needs.verify.outputs.deploy_scripts == 'true' || inputs.force_all == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download image digests
        if: ${{ needs.verify.outputs.has_images == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.9
        with:
          pattern: digests-*
          path: all-digests
          merge-multiple: true

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Sync deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/facebook-messenger-ai-rep/backups'
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes \
            compose.prod.yml scripts/deploy.sh scripts/image-retention.sh \
            "$VPS_USER@$VPS_HOST:/opt/facebook-messenger-ai-rep/"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'chmod 755 /opt/facebook-messenger-ai-rep/deploy.sh /opt/facebook-messenger-ai-rep/image-retention.sh'

      - name: Log VPS in to GHCR
        if: ${{ needs.verify.outputs.has_images == 'true' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy selective images & migrations
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DB_MIGRATE: ${{ needs.verify.outputs.db_migration }}
          COMPOSE_CONFIG: ${{ needs.verify.outputs.compose_config }}
        run: |
          set -euo pipefail
          deploy_args=()
          if [ "$DB_MIGRATE" = "true" ]; then
            deploy_args+=(--migrate)
          fi
          if [ "$COMPOSE_CONFIG" = "true" ]; then
            deploy_args+=(--reconcile)
          fi
          if [ -d all-digests ]; then
            if [ -f all-digests/core ]; then
              deploy_args+=(--core "$(cat all-digests/core)")
            fi
            if [ -f all-digests/browser-agent ]; then
              deploy_args+=(--browser-agent "$(cat all-digests/browser-agent)")
            fi
          fi

          if [ ${#deploy_args[@]} -gt 0 ]; then
            ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST" "/opt/facebook-messenger-ai-rep/deploy.sh ${deploy_args[*]}"
          else
            echo "Deployment files synchronized. No image, migration, or compose updates required."
          fi

      - name: Report deployment status
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" '/opt/facebook-messenger-ai-rep/deploy.sh --status' || true

      - name: Remove ephemeral GHCR credentials
        if: always() && needs.verify.outputs.has_images == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'docker logout ghcr.io' || true
