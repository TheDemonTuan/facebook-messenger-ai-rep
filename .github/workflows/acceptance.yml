name: Production Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres@127.0.0.1:5432/messenger_ai_test
  NODE_ENV: test
  XAI_API_KEY: test-key-not-used
  XAI_BASE_URL: https://api.x.ai/v1
  XAI_MODEL: grok-4.5
  DEFAULT_CHANNEL_ACCOUNT_ID: personal-messenger
  ADMIN_EMAIL: admin@example.com

jobs:
  database:
    name: PostgreSQL migration and race tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: messenger_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messenger_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - name: Build shared packages
        run: bun run --filter='!@messenger/dashboard' build
      - name: Apply empty-database migration twice
        run: |
          bun run db:migrate
          bun run db:migrate
      - name: Seed baseline twice
        run: |
          bun run db:seed
          bun run db:seed
      - name: Run PostgreSQL integration and crash tests
        run: bun run test:postgres-acceptance
      - name: Verify backup and restore
        shell: bash
        run: bash tests/backup-restore-acceptance.sh

  dashboard:
    name: Dashboard browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: cd apps/browser-agent && bunx playwright install --with-deps chromium
      - name: Run desktop and mobile browser acceptance
        run: bun run test:dashboard-acceptance

  containers:
    name: Production container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: acceptance-ci-not-a-real-password
          SESSION_SECRET: acceptance-ci-session-placeholder-min32chars
          INTERNAL_HMAC_SECRET: acceptance-ci-hmac-placeholder-min32chars
          ADMIN_EMAIL: admin@example.com
          XAI_API_KEY: acceptance-placeholder
          CLOUDFLARE_TUNNEL_TOKEN: acceptance-placeholder
          CLOUDFLARE_ACCESS_TEAM_NAME: acceptance-team
          CLOUDFLARE_ACCESS_AUD: acceptance-audience
        run: docker compose -f compose.prod.yml config --quiet
      - name: Build production images
        run: |
          docker build -f docker/Dockerfile.core -t messenger-core:acceptance .
          docker build -f docker/Dockerfile.browser-agent -t messenger-browser-agent:acceptance .
      - name: Inspect runtime images
        run: |
          docker run --rm --entrypoint bun messenger-core:acceptance --version
          docker run --rm --entrypoint bun messenger-browser-agent:acceptance --version
