services:
  postgres:
    image: postgres:17-alpine
    container_name: messenger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messenger_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-messenger_ai}
    volumes:
      - messenger_postgres_data:/var/lib/postgresql/data
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messenger_user} -d ${POSTGRES_DB:-messenger_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: messenger-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - messenger_redis_data:/data
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${CONTROL_PLANE_IMAGE:-messenger-control-plane:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
    container_name: messenger-migrate
    command: ["sh", "-c", "node packages/db/dist/migrate.js && node packages/db/dist/seed.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messenger_net

  control-plane:
    image: ${CONTROL_PLANE_IMAGE:-messenger-control-plane:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
    container_name: messenger-control-plane
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      CLOUDFLARE_ACCESS_TEAM_NAME: ${CLOUDFLARE_ACCESS_TEAM_NAME:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3

  scheduler:
    image: ${SCHEDULER_IMAGE:-messenger-scheduler:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    container_name: messenger-scheduler
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - messenger_net

  ai-worker:
    image: ${AI_WORKER_IMAGE:-messenger-ai-worker:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-worker
    container_name: messenger-ai-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-https://omniroute-api.tuannguyenviet.site/v1}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-gemini-3.7-flash-low}
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - messenger_net

  browser-agent:
    image: ${BROWSER_AGENT_IMAGE:-messenger-browser-agent:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.browser-agent
    container_name: messenger-browser-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:6081:6080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BROWSER_PROFILE_DIR: /app/browser_profile
      BROWSER_HEADLESS: "false"
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    volumes:
      - messenger_browser_profile:/app/browser_profile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - messenger_net

  # Dedicated Cloudflare Tunnel for Messenger (Start with: docker compose up -d tunnel)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: messenger-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - control-plane
      - browser-agent
    networks:
      - messenger_net

volumes:
  messenger_postgres_data:
  messenger_redis_data:
  messenger_browser_profile:

networks:
  messenger_net:
    driver: bridge
