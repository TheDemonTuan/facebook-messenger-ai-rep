name: messenger-ai

services:
  postgres:
    image: postgres:17-alpine
    container_name: messenger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messenger_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-messenger_ai}
    volumes:
      - messenger_postgres_data:/var/lib/postgresql/data
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messenger_user} -d ${POSTGRES_DB:-messenger_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: messenger-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - messenger_redis_data:/data
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${CONTROL_PLANE_IMAGE:-messenger-control-plane:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
    container_name: messenger-migrate
    command: ["bun", "packages/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messenger_net

  seed:
    image: ${CONTROL_PLANE_IMAGE:-messenger-control-plane:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
    container_name: messenger-seed
    command: ["bun", "packages/db/dist/seed.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messenger_net
    profiles:
      - tools

  control-plane:
    image: ${CONTROL_PLANE_IMAGE:-messenger-control-plane:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
    container_name: messenger-control-plane
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      CLOUDFLARE_ACCESS_TEAM_NAME: ${CLOUDFLARE_ACCESS_TEAM_NAME:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://127.0.0.1:3000/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    image: ${SCHEDULER_IMAGE:-messenger-scheduler:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    container_name: messenger-scheduler
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'const fs=require(\"fs\"); const t=Number(fs.readFileSync(\"/tmp/healthy\",\"utf8\")); if(isNaN(t)||Date.now()-t>30000) process.exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  ai-worker:
    image: ${AI_WORKER_IMAGE:-messenger-ai-worker:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-worker
    container_name: messenger-ai-worker
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SPACEXAI_API_KEY: ${SPACEXAI_API_KEY:-}
      SPACEXAI_BASE_URL: ${SPACEXAI_BASE_URL:-https://api.spacexai.com/v1}
      SPACEXAI_MODEL: ${SPACEXAI_MODEL:-spacex-chat-v1}
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'const fs=require(\"fs\"); const t=Number(fs.readFileSync(\"/tmp/healthy\",\"utf8\")); if(isNaN(t)||Date.now()-t>30000) process.exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  browser-agent:
    image: ${BROWSER_AGENT_IMAGE:-messenger-browser-agent:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.browser-agent
    container_name: messenger-browser-agent
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:6081:6080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BROWSER_PROFILE_DIR: /app/browser_profile
      BROWSER_HEADLESS: "false"
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    volumes:
      - messenger_browser_profile:/app/browser_profile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - messenger_net
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:6080/ >/dev/null && bun -e 'const fs=require(\"fs\"); const t=Number(fs.readFileSync(\"/tmp/healthy\",\"utf8\")); if(isNaN(t)||Date.now()-t>30000) process.exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Dedicated Cloudflare Tunnel for Messenger (Start with: docker compose up -d tunnel)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: messenger-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - control-plane
      - browser-agent
    networks:
      - messenger_net

volumes:
  messenger_postgres_data:
  messenger_redis_data:
  messenger_browser_profile:

networks:
  messenger_net:
    driver: bridge
