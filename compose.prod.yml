name: messenger-ai

services:
  postgres:
    image: postgres:17-alpine
    container_name: messenger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messenger_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-messenger_ai}
    volumes:
      - messenger_postgres_data:/var/lib/postgresql/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messenger_user} -d ${POSTGRES_DB:-messenger_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${CORE_IMAGE:-messenger-core:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: messenger-migrate
    command: ["bun", "packages/db/dist/migrate.js"]
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    init: true
    cap_drop:
      - ALL
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  core:
    image: ${CORE_IMAGE:-messenger-core:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: messenger-core
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    init: true
    cap_drop:
      - ALL
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 100
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      XAI_API_KEY: ${XAI_API_KEY}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      XAI_MODEL: ${XAI_MODEL:-grok-4.5}
      CLOUDFLARE_ACCESS_TEAM_NAME: ${CLOUDFLARE_ACCESS_TEAM_NAME:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://127.0.0.1:3000/readyz\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  browser-agent:
    image: ${BROWSER_AGENT_IMAGE:-messenger-browser-agent:local}
    build:
      context: .
      dockerfile: docker/Dockerfile.browser-agent
    container_name: messenger-browser-agent
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    init: true
    cap_drop:
      - ALL
    user: "1000:1000"
    pids_limit: 200
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messenger_ai}
      BROWSER_PROFILE_DIR: /app/browser_profile
      BROWSER_HEADLESS: "false"
      DEFAULT_CHANNEL_ACCOUNT_ID: ${DEFAULT_CHANNEL_ACCOUNT_ID:-personal-messenger}
      CORE_API_URL: http://core:3000
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      ENABLE_NOVNC: "false"
    volumes:
      - messenger_browser_profile:/app/browser_profile:rw
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /dev/shm:rw,nosuid,size=1024m
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'const fs=require(\"fs\"); const t=Number(fs.readFileSync(\"/tmp/healthy\",\"utf8\")); if(isNaN(t)||Date.now()-t>30000) process.exit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    container_name: messenger-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      core:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    init: true
    cap_drop:
      - ALL
    user: "65532:65532"
    pids_limit: 50
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  messenger_postgres_data:
  messenger_browser_profile:

networks:
  edge:
    name: messenger_edge
    driver: bridge
  app:
    name: messenger_app
    internal: true
    driver: bridge
  data:
    name: messenger_data
    internal: true
    driver: bridge
