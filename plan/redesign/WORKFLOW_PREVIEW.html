<script>const stateLabels = {
    done: "Đã ghi nhận", active: "Đang xử lý", waiting: "Đang chờ",

    SESSION_SUSPENDED: "Kênh đã tạm dừng để kiểm tra",

    MANUAL_TAKEOVER: "Nhân viên bắt đầu hỗ trợ",

const eventLabel = (type) => eventLabels[type] || "Cập nhật hệ thống";
function timestamp(value) {
    if (typeof value !== "string" && !(value instanceof Date))
        return null;
    const n = new Date(value).getTime();
    return Number.isFinite(n) ? n : null;

function formatTime(value) {
    const n = timestamp(value);

        return "Nhân viên hỗ trợ";
    const labels = {
        QUEUED: "Chờ đến lượt", CLAIMED: "Đang xử lý", DEBOUNCING: "Đang gom tin",
        READING: "Đang đọc tin", THINKING: "AI đang trả lời", DRAFT_READY: "Chờ soạn tin",
        TYPING: "Đang soạn tin", SENDING: "Đang xác nhận gửi", WAITING_CUSTOMER: "Chờ khách phản hồi",
        MANUAL: "Nhân viên hỗ trợ", BLOCKED: "Không tự động trả lời", ERROR: "Cần kiểm tra",
    };
    return labels[status] || "Chưa rõ trạng thái";

function itemIsActive(item) {

/**
 * Compatibility projection over existing, bounded conversation-detail API.
 * NEVER combine channel-wide "latest" records; NEVER infer that AI success means delivery.
 * This is not a complete distributed trace. Missing evidence stays visibly unknown.
 */
function buildWorkflowView(data, requestedVersion) {
    const conv = data.conversation;
    const version = requestedVersion ?? conv.inboundVersion;
    const current = version === conv.inboundVersion;
    const events = (data.events || []).filter(e => e.inboundVersion === version)
        .sort((a, b) => (timestamp(a.createdAt) ?? 0) - (timestamp(b.createdAt) ?? 0));

        .sort((a, b) => (timestamp(a.timestamp) ?? 0) - (timestamp(b.timestamp) ?? 0));

    const has = (type) => events.some(e => e.type === type);
    const workerStarted = events.some(e => e.type === "AI_STARTED" && e.actor === "AI_WORKER");
    const policy = inbound.find(m => m.skipReason)?.skipReason ?? null;
    const manifest = safeObject(run?.requestSnapshot?.contextManifest);
    const expectedCount = run?.usedResult?.messages?.length
        ?? numberField(run?.parsedOutput?.messageCount) ?? null;
    const confirmedCount = actions.filter(a => confirmed.has(String(a.status))).length;
    const hasUncertain = actions.some(a => uncertain.has(String(a.status)));
    const hasFailed = actions.some(a => String(a.status) === "FAILED");
    const sending = actions.some(a => ["SEND_INTENT", "SENDING"].includes(String(a.status)));
    const typing = actions.some(a => String(a.status) === "TYPING");
    const allCancelled = actions.length > 0 && actions.every(a => stopped.has(String(a.status)));
    const allExpectedConfirmed = expectedCount !== null && expectedCount > 0 &&
        actions.length === expectedCount && confirmedCount === expectedCount;
    const cancelled = has("AI_CANCELLED_STALE") || allCancelled || run?.status === "STALE_ABORTED";
    const eligibleToRun = current && !conv.manualMode && !conv.isBlocked && !cancelled;
    const stages = [
        {
            id: "inbound", label: "Nhận tin", state: inbound.length || has("INBOUND_RECEIVED") ? "done" : "unknown",
            description: "Nội dung khách gửi trong đúng lượt đang xem.",
            evidence: inbound.length ? `Đã tải ${inbound.length} tin của lượt này.` : "Chưa tải được nội dung của lượt này.",
        },
        {
            id: "policy", label: "Kiểm tra",
            state: policy ? (policy.eligible ? "done" : "warning") : "unknown",
            description: "Kiểm tra lượt này có được phép trả lời tự động hay không.",
            evidence: policy?.humanReadableReason || "API hiện tại chưa cung cấp kết quả kiểm tra cho lượt này.",
        },
        {
            id: "debounce", label: "Gom tin",
            state: has("DEBOUNCE_STARTED") || has("DEBOUNCE_RESET")
                ? (eligibleToRun && conv.status === "DEBOUNCING" ? "waiting" : workerStarted || run ? "done" : cancelled ? "cancelled" : "unknown")
                : "unknown",
            description: "Chờ ngắn để gom các tin khách gửi liên tiếp.",
            evidence: eligibleToRun && conv.status === "DEBOUNCING"
                ? "Hội thoại đang chờ khách nhắn thêm; chưa có hạn chờ chính xác từ API."
                : has("DEBOUNCE_STARTED") ? "Có sự kiện gom tin trong lượt này." : "Chưa có sự kiện gom tin trong dữ liệu đã tải.",
        },
        {
            id: "ai", label: "AI trả lời",
            state: cancelled ? "cancelled" : run
                ? run.status === "SUCCESS" ? "done" : "error"
                : eligibleToRun && conv.status === "THINKING" ? "active" : "unknown",
            description: "Chuẩn bị ngữ cảnh, gọi dịch vụ AI và kiểm tra câu trả lời.",
            evidence: run ? `Kết quả của lần gọi ${run.id.slice(0, 8)}: ${run.status === "SUCCESS" ? "đã tạo câu trả lời" : "cần kiểm tra"}.`
                : workerStarted ? "Đã có sự kiện bắt đầu; chưa nhận được kết quả AI." : "Chưa có kết quả AI cho lượt này.",
        },
        {
            id: "typing", label: "Soạn tin",
            state: cancelled ? "cancelled" : typing && eligibleToRun ? "active"
                : allExpectedConfirmed || hasUncertain || sending ? "done"
                    : confirmedCount > 0 && actions.some(a => String(a.status) === "PENDING") ? "waiting"
                        : has("TYPING_ABORTED") ? "cancelled" : "unknown",
            description: "Đưa câu trả lời đã duyệt vào ô soạn tin Messenger.",
            evidence: typing && eligibleToRun ? "Có thao tác soạn tin đang hoạt động."
                : actions.length ? `Có ${actions.length} thao tác gửi trong dữ liệu đã tải.` : "Chưa có thao tác soạn tin.",
        },
        {
            id: "delivery", label: "Xác nhận gửi",
            state: hasUncertain ? "warning" : hasFailed ? "error" : allExpectedConfirmed ? "done"
                : sending ? "active" : allCancelled ? "cancelled" : "unknown",
            description: "Chỉ xác nhận khi có bằng chứng gửi. Không đồng nghĩa khách đã đọc.",
            evidence: hasUncertain ? "Chưa chắc tin đã gửi. Không tự động gửi lại."
                : allExpectedConfirmed ? `Đã xác nhận ${confirmedCount}/${expectedCount} tin dự kiến.`
                    : confirmedCount > 0 ? `Đã xác nhận ${confirmedCount} tin; chưa đủ bằng chứng hoàn tất cả lượt.`
                        : sending ? "Đã bắt đầu thao tác gửi; đang chờ xác nhận." : "Chưa có bằng chứng gửi thành công.",
        },
    ];
    let title = shortStatus(conv.status, conv.manualMode);
    let tone = "unknown";
    if (!current)
        title = `Lượt trước #${version}`;
    if (hasUncertain) {
        title = "Cần xác nhận kết quả gửi";
        tone = "warning";
    }
    else if (cancelled) {
        title = "Lượt này đã dừng";
        tone = "cancelled";
    }
    else if (hasFailed || run?.status === "ERROR" || run?.status === "GUARD_REJECTED") {
        title = "Có lỗi cần kiểm tra";
        tone = "error";
    }
    else if (allExpectedConfirmed) {
        title = "Đã xác nhận các tin của lượt này";
        tone = "done";
    }
    else if (confirmedCount > 0 && expectedCount !== null && confirmedCount < expectedCount) {
        title = "Còn tin chưa xác nhận gửi";
        tone = "waiting";
    }
    else if (eligibleToRun && ["THINKING", "TYPING", "SENDING", "DRAFT_READY", "READING"].includes(conv.status))
        tone = "active";
    else if (eligibleToRun && ["DEBOUNCING", "QUEUED"].includes(conv.status))
        tone = "waiting";
    const versions = Array.from(new Set([
        conv.inboundVersion, ...(data.messages || []).map(m => m.inboundVersion),
        ...(data.aiRuns || []).map(r => r.inboundVersion),
        ...(data.events || []).map(e => e.inboundVersion),
        ...(data.outboundActions || []).map(a => a.inboundVersion),
    ].filter((v) => typeof v === "number" && Number.isInteger(v) && v > 0))).sort((a, b) => b - a);
    return {
        conversationId: conv.id, version, current, versions, stages, title, tone,
        correlationKey: `${conv.channelAccountId}:${conv.id}:${version}`,
        name: data.customer?.name || conv.title || "Khách hàng Messenger",
        messages, inbound, runs, run, actions, events, policy, manifest,
        selectedCount: numberField(manifest?.selectedCount),
        estimatedTokens: numberField(manifest?.estimatedTokens),
        confirmedCount, expectedCount, hasUncertain, allExpectedConfirmed,
        limited: true, // Existing API caps AI runs/actions/events; never claim a full trace.
    };
}

function makeFixture(id,name,version,mode,text) {

    skipReason:{decision:"ELIGIBLE",eligible:true,reasonCode:"ELIGIBLE",humanReadableReason:"Được phép trả lời tự động",reason:"",precedenceStep:"ELIGIBLE"}};
  const events=[];

  }
  event("INBOUND_RECEIVED",0,"CUSTOMER");event("DEBOUNCE_STARTED",40,"BROWSER_AGENT");

    usedResult:{messages:response,needsClarification:true},parsedOutput:{messageCount:2},errorMessage:null};
  const actions=[];
  if(mode!=="DEBOUNCING") {
    event("AI_STARTED",3000);
    if(mode!=="THINKING") {
      event("DRAFT_CREATED",4840);
      response.forEach((text,index)=>actions.push({id:"uuid-"+id+index,actionId:"action-"+id+index,
        inboundVersion:version,responseIndex:index,text,actor:"AI",status:index===0?"TYPING":"PENDING",
        unconfirmedReason:null,errorMessage:null,createdAt:iso(4900+index)}));
      event("TYPING_STARTED",5000,"AI");

  if(mode==="WAITING_CUSTOMER") {
    actions.forEach(a=>a.status="CONFIRMED");event("SEND_INTENT",7000,"AI");event("SEND_CONFIRMED",7800,"AI");event("CONVERSATION_RELEASED",7900);
  }
  if(mode==="ERROR") {

    actions[0].unconfirmedReason="Chưa tìm thấy bằng chứng gửi đáng tin cậy.";
  }
  return {conversation:conv,customer,messages:[inbound],aiRuns:["DEBOUNCING","THINKING"].includes(mode)?[]:[run],
    outboundActions:actions,events,hasMoreMessages:false};

 if(action==="events"){tab="events";renderMain()}
 if(action==="reset"){location.reload()}
 if(action==="pause"){paused=!paused;button.innerHTML=icon(paused?"play":"pause",14)+(paused?" Tiếp tục mô phỏng":" Dừng mô phỏng")}
 if(action==="simulate"){
  if(paused){notice="Đang dừng mô phỏng. Bấm Tiếp tục mô phỏng.";renderMain();return}
  const d=demoRecords[selected];
  if(d.outboundActions.some(a=>a.status==="SEND_UNCERTAIN")){notice="Bản thiết kế không cho gửi lại khi chưa rõ kết quả.";renderMain();return}
  if(!d.outboundActions.length){notice="Chọn Mai Anh để thử bước xác nhận gửi.";renderMain();return}
  d.outboundActions.forEach(a=>a.status="CONFIRMED");d.conversation.status="WAITING_CUSTOMER";
  d.events.push({id:"demo-confirm-"+Date.now(),type:"SEND_CONFIRMED",inboundVersion:d.conversation.inboundVersion,actor:"AI",payload:{},createdAt:iso(8000)});
  renderList();renderMain();
  const active=demoRecords.filter(d=>itemIsActive({conversation:d.conversation})).length;
  document.querySelectorAll(".wf-stat strong")[1].textContent=String(active);
 }
 if(action==="copy"){
  try{await navigator.clipboard.writeText(selectedView().correlationKey);notice="Đã sao chép mã lượt."}catch{notice="Mã lượt có trong Chi tiết kỹ thuật."}renderMain();
 }
});
setup();
</script></body></html>
